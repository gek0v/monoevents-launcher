[package]
name = "monoevents-launcher"
version = "0.1.0"
description = "Launcher oficial para Minecraft de la comunidad MonoEvents"
authors = ["MonoEvents Team"]
license = "MIT"
edition = "2021"

[lib]
name = "monoevents_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-updater = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
keyring = "3.0"
log = "0.4"
env_logger = "0.11"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
