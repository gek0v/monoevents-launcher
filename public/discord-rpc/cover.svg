<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="576" viewBox="0 0 1024 576">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <radialGradient id="glowOrange" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRose" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#be123c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo Squircle Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Anvil Stroke -->
    <linearGradient id="anvilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1024" height="576" fill="url(#bgBase)"/>
  <rect width="1024" height="576" fill="url(#glowOrange)"/>
  <rect width="1024" height="576" fill="url(#glowRose)"/>

  <!-- Subtle Atmospheric Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="96" x2="1024" y2="96"/>
    <line x1="0" y1="192" x2="1024" y2="192"/>
    <line x1="0" y1="288" x2="1024" y2="288"/>
    <line x1="0" y1="384" x2="1024" y2="384"/>
    <line x1="0" y1="480" x2="1024" y2="480"/>
    <line x1="128" y1="0" x2="128" y2="576"/>
    <line x1="256" y1="0" x2="256" y2="576"/>
    <line x1="384" y1="0" x2="384" y2="576"/>
    <line x1="512" y1="0" x2="512" y2="576"/>
    <line x1="640" y1="0" x2="640" y2="576"/>
    <line x1="768" y1="0" x2="768" y2="576"/>
    <line x1="896" y1="0" x2="896" y2="576"/>
  </g>

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="984" height="536" rx="28" fill="none" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Floating Embers / Sparks -->
  <circle cx="280" cy="140" r="2.5" fill="#f97316" opacity="0.8"/>
  <circle cx="220" cy="380" r="3.5" fill="#f59e0b" opacity="0.6"/>
  <circle cx="560" cy="110" r="2" fill="#fb7185" opacity="0.7"/>
  <circle cx="620" cy="480" r="3" fill="#ea580c" opacity="0.8"/>
  <circle cx="890" cy="160" r="2.5" fill="#f97316" opacity="0.9"/>

  <!-- ==============================================
       LEFT COLUMN: MAIN BRAND & DETAILS
       ============================================== -->
  <g transform="translate(64, 90)">
    <!-- Pill Badge: Evento Oficial -->
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#ea580c" fill-opacity="0.18" stroke="#f97316" stroke-width="1" stroke-opacity="0.45"/>
    <g transform="translate(10, 6)" stroke="#fb923c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" transform="scale(0.7)"/>
    </g>
    <text x="32" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fb923c" letter-spacing="1.2">EVENTO OFICIAL DE HALLOWEEN</text>

    <!-- Main Title Group with Ghost Logo -->
    <g transform="translate(0, 52)">
      <!-- Squircle Ghost Emblem (84x84) -->
      <rect x="0" y="0" width="84" height="84" rx="24" fill="url(#logoGrad)" stroke="#ffedd5" stroke-width="2" stroke-opacity="0.4"/>
      <!-- Lucide Ghost Centered inside 84x84 (scaled from 24x24: scale=2.1, translate=16.8) -->
      <g transform="translate(16.8, 16.8) scale(2.1)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z" fill="rgba(255, 255, 255, 0.22)"/>
        <circle cx="9" cy="10" r="1.1" fill="#ffffff" stroke="none"/>
        <circle cx="15" cy="10" r="1.1" fill="#ffffff" stroke="none"/>
      </g>

      <!-- Text: MonoCraft -->
      <text x="104" y="52" font-family="system-ui, sans-serif" font-size="54" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1">MonoCraft</text>
      <!-- Subtitle: Noche de Sangre -->
      <text x="106" y="80" font-family="system-ui, sans-serif" font-size="19" font-weight="800" fill="#fb7185" letter-spacing="3.5">NOCHE DE SANGRE</text>
    </g>

    <!-- Description Paragraph -->
    <g transform="translate(0, 175)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="14.5" fill="#cbd5e1" font-weight="500">Supervivencia extrema con ruletas de la suerte interactivas,</text>
      <text x="0" y="24" font-family="system-ui, sans-serif" font-size="14.5" fill="#cbd5e1" font-weight="500">eventos climáticos dinámicos, airdrops y chat de voz de proximidad.</text>
    </g>

    <!-- Info Pills Row -->
    <g transform="translate(0, 240)">
      <!-- Pill 1: Forge 1.20.1 -->
      <rect x="0" y="0" width="136" height="34" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12"/>
      <g transform="translate(12, 8)" stroke="#f97316" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Swords mini -->
        <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5" transform="scale(0.75)"/>
        <line x1="9.75" x2="14.25" y1="14.25" y2="9.75"/>
      </g>
      <text x="36" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Forge 1.20.1</text>

      <!-- Pill 2: Website -->
      <rect x="150" y="0" width="170" height="34" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12"/>
      <g transform="translate(162, 8)" stroke="#f97316" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Globe mini -->
        <circle cx="9" cy="9" r="8"/>
        <path d="M9 1a11.6 11.6 0 0 0 0 16 11.6 11.6 0 0 0 0-16"/>
        <path d="M1 9h16"/>
      </g>
      <text x="188" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">mc-gko.vercel.app</text>

      <!-- Pill 3: IP Server -->
      <rect x="334" y="0" width="170" height="34" rx="12" fill="#ea580c" fill-opacity="0.12" stroke="#ea580c" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="350" cy="17" r="4" fill="#34d399"/>
      <text x="364" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f8fafc">gek0.duckdns.org</text>
    </g>
  </g>

  <!-- ==============================================
       RIGHT COLUMN: 3 SHOWCASE CARDS (Glassmorphism)
       ============================================== -->
  <g transform="translate(670, 100)">
    <!-- Card 1: Noche de Sangre (Flame) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="280" height="88" rx="20" fill="url(#glassCard)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>
      <rect x="16" y="16" width="56" height="56" rx="16" fill="#e11d48" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.35"/>
      <!-- Flame Icon -->
      <g transform="translate(28, 28) scale(1.33)" stroke="#f43f5e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
      </g>
      <text x="86" y="42" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Noche de Sangre</text>
      <text x="86" y="62" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8">Hordas y Eventos Vivos</text>
    </g>

    <!-- Card 2: Ruletas & Airdrops (Anvil) -->
    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="280" height="88" rx="20" fill="url(#glassCard)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>
      <rect x="16" y="16" width="56" height="56" rx="16" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.35"/>
      <!-- Anvil Icon -->
      <g transform="translate(28, 28) scale(1.33)" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 10H6a4 4 0 0 1-4-4 1 1 0 0 1 1-1h4"/>
        <path d="M7 5a1 1 0 0 1 1-1h13a1 1 0 0 1 1 1 7 7 0 0 1-7 7H8a1 1 0 0 1-1-1z" fill="rgba(245, 158, 11, 0.2)"/>
        <path d="M9 12v5"/>
        <path d="M15 12v5"/>
        <path d="M5 20a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3 1 1 0 0 1-1 1H6a1 1 0 0 1-1-1" fill="rgba(245, 158, 11, 0.2)"/>
      </g>
      <text x="86" y="42" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Ruleta y Botines</text>
      <text x="86" y="62" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8">Airdrops de Supervivencia</text>
    </g>

    <!-- Card 3: Chat de Voz (Microphone) -->
    <g transform="translate(0, 216)">
      <rect x="0" y="0" width="280" height="88" rx="20" fill="url(#glassCard)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>
      <rect x="16" y="16" width="56" height="56" rx="16" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" stroke-opacity="0.35"/>
      <!-- Mic Icon -->
      <g transform="translate(28, 28) scale(1.33)" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" x2="12" y1="19" y2="22"/>
      </g>
      <text x="86" y="42" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Voz de Proximidad</text>
      <text x="86" y="62" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8">Chat 3D in-game nativo</text>
    </g>
  </g>
</svg>
